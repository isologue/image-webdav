services:
  manager:
    build: ./manager
    restart: unless-stopped
    environment:
      INITIAL_USERNAME: ${INITIAL_USERNAME:-admin}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-admin2026}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:8000"
    volumes:
      - images:/data
      - settings:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      start_interval: 3s
      start_period: 30s
      timeout: 2s
      retries: 15

volumes:
  images:
  settings:
