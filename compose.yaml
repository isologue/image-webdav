services:
  init:
    image: alpine:3.21
    command: sh -c 'mkdir -p /data/chatgpt2api/images /config && chown 101:101 /data /data/chatgpt2api /data/chatgpt2api/images /config'
    volumes:
      - images:/data
      - settings:/config
    restart: "no"

  manager:
    build: ./manager
    restart: unless-stopped
    user: "101:101"
    environment:
      INITIAL_USERNAME: ${INITIAL_USERNAME:?Set INITIAL_USERNAME in .env}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in .env}
    volumes:
      - images:/data
      - settings:/config
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      start_interval: 3s
      start_period: 30s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - images:/srv/dav
      - settings:/config:ro
    depends_on:
      manager:
        condition: service_healthy

volumes:
  images:
  settings:
