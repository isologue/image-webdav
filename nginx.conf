server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /dav/ {
        root /srv;
        auth_basic "Image WebDAV";
        auth_basic_user_file /config/dav.htpasswd;
        if ($request_method = MKCOL) {
            rewrite ^(/dav/.+[^/])$ $1/ last;
        }
        dav_methods PUT DELETE MKCOL;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
    }

    location /images/ {
        alias /srv/dav/chatgpt2api/images/;
        autoindex off;
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
    }

    location = /admin { return 308 /admin/; }

    location /admin/ {
        auth_basic "Image WebDAV Admin";
        auth_basic_user_file /config/dav.htpasswd;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://manager:8000/;
    }

    location = / { return 308 /admin/; }
    location / { return 404; }
}
